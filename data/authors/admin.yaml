bio: |
  I am currently a Postdoctoral Researcher at <span class="underlined-entity">Lawrence Berkeley National Laboratory</span> in the Grid Integration Group, advised by <span class="underlined-entity">Dr. Miguel Heleno</span>. I received my PhD in Electrical Engineering from <span class="underlined-entity">The University of Hong Kong</span>, advised by <span class="underlined-entity">Prof. Yunhe Hou</span>. My research focuses on power system resilience under extreme events, uncertainty quantification and optimization for renewable integration, transportation electrification and EV charging infrastructure, and integrated transmission-distribution system planning.

  Outside of work, I enjoy music, dancing, and reading.

