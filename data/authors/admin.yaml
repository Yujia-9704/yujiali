bio: |
  I am currently a Postdoctoral Researcher at [Lawrence Berkeley National Laboratory](https://www.lbl.gov/) in the Grid Integration Group, advised by [Dr. Miguel Heleno](https://profiles.lbl.gov/22704-miguel-heleno). My research focuses on resilient and sustainable power systems under exogenous and endogenous uncertainty, with emphasis on uncertainty quantification and optimization for renewable integration, transportation electrification and EV charging infrastructure, and integrated transmission-distribution planning.

  Outside of work, I enjoy music, dancing, and reading.

